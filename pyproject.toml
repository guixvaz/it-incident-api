[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "it-incident-api"
version = "0.1.0"
description = "IT incident management API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "sqlmodel>=0.0.22",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
